services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: vetflow-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      CLINIC_SERVICE_URL: http://clinic-service:3001
      SCHEDULING_SERVICE_URL: http://scheduling-service:3002
      IDENTITY_SERVICE_URL: http://identity-service:3003
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    ports:
      - "3000:3000"
    depends_on:
      clinic-service:
        condition: service_healthy
      scheduling-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vetflow-web
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    container_name: vetflow-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    ports:
      # Connect from your Mac (for example with MongoDB Compass) on this port.
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  clinic-service:
    build:
      context: .
      dockerfile: apps/clinic-service/Dockerfile
    container_name: vetflow-clinic-service
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/vetflow_clinic?authSource=admin
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      IDENTITY_SERVICE_URL: http://identity-service:3003
      SCHEDULING_SERVICE_URL: http://scheduling-service:3002
      UPLOADS_DIR: /data/uploads
    volumes:
      - clinic-uploads:/data/uploads
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  scheduling-service:
    build:
      context: .
      dockerfile: apps/scheduling-service/Dockerfile
    container_name: vetflow-scheduling-service
    environment:
      NODE_ENV: development
      PORT: 3002
      HOST: 0.0.0.0
      CLINIC_SERVICE_URL: http://clinic-service:3001
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/vetflow_scheduling?authSource=admin
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    ports:
      - "3002:3002"
    depends_on:
      mongo:
        condition: service_healthy
      clinic-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  identity-service:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    container_name: vetflow-identity-service
    environment:
      NODE_ENV: development
      PORT: 3003
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/vetflow_identity?authSource=admin
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # Set to "true" once the site is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Used only on first start, to create the clinic and its first admin.
      INITIAL_CLINIC_NAME: ${INITIAL_CLINIC_NAME:-Equora}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Clinic Administrator}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "3003:3003"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3003/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  mongo-data:
  # Uploaded documents and images (clinic-service).
  clinic-uploads:
